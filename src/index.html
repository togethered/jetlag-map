<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bun Map</title>
    <link href="/css/maplibre-gl.css" rel="stylesheet" />
    <link href="/css/compass.css" rel="stylesheet" />
    <link href="/css/ruler.css" rel="stylesheet" />
    <link href="/css/export.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
      }
    
      #map {
        height: 100vh;
        width: 100vw;
      }
    
      .mapbox-ctrl-ruler,
      .mapbox-ctrl-compass {
        background: #fff;
        border-radius: 4px;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
        margin: 10px 10px 0 0;
        float: right;
        clear: both;
        pointer-events: auto;
      }
    
      .mapbox-ctrl-ruler button,
      .mapbox-ctrl-compass button {
        width: 29px;
        height: 29px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        outline: none;
        border: 0;
        box-sizing: border-box;
        background-color: transparent;
        cursor: pointer;
        font-size: 16px;
      }
    
      .mapbox-ctrl-ruler button:hover,
      .mapbox-ctrl-compass button:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }

      .filter-ctrl {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1;
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
        font-family: sans-serif;
      }

      .filter-ctrl h3 {
        margin: 0 0 10px 0;
        font-size: 16px;
      }

      .filter-ctrl div {
        margin-bottom: 5px;
      }

      .filter-ctrl label {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="filter-ctrl">
      <h3>Points of Interest</h3>
      <div>
        <input type="radio" id="none" name="category" value="none" checked>
        <label for="none">None</label>
      </div>
      <div>
        <input type="radio" id="theater" name="category" value="Movie Theater">
        <label for="theater">Movie Theaters</label>
      </div>
      <div>
        <input type="radio" id="aquarium" name="category" value="Aquarium">
        <label for="aquarium">Aquariums</label>
      </div>
      <div>
        <input type="radio" id="museum" name="category" value="Museum">
        <label for="museum">Museums</label>
      </div>
    </div>
    <script src="/main.js" type="module"></script>
  </body>
</html>
