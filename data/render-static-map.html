<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>render static map</title>
    <meta name="description" content="render static map" />

    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
      }
      svg {
        width: 100%;
        height: 100%;
        fill: none;
      }
      #city-limits {
        stroke: blue;
      }
      #streets {
        stroke: grey;
        stroke-opacity: 0.5;
        stroke-width: 0.5;
      }
      #train-lines {
        stroke: red;
        stroke-width: 1.5;
      }
      #poi circle {
        fill: grey;
        r: 3px;

        &[data-tourism="zoo"] {
          fill: lime;
          r: 6px;
        }
        &[data-tourism="aquarium"] {
          fill: cyan;
          r: 6px;
        }
        &[data-amenity="library"] {
          fill: magenta;
        }
        &[data-tourism="museum"] {
          fill: orange;
        }
        &[data-amenity="hospital"] {
          fill: red;
        }
      }
      #stations circle {
        r: 2px;
        stroke-opacity: 0.8;
        stroke: white;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg">
      <path id="train-lines" />
      <path id="streets" />
      <path id="city-limits" />
      <g id="poi"></g>
      <g id="stations"></g>
    </svg>
    <script type="module">
      if (window.location.protocol === "file:") {
        alert("please serve this on http server");
      }

      /**
       * https://github.com/SheepTester/ucsd-classrooms/blob/main/src/lib/locations.ts
       */
      function latLongToPixel({ lat, lon }) {
        return {
          // fround to see what happens with f32 precision
          x: Math.fround(lon) / 180 + 1,
          y: -(
            Math.log(
              Math.tan(Math.PI / 4 + (Math.fround(lat) * Math.PI) / 360)
            ) /
              Math.PI +
            1
          ),
        };
      }
      function extremes(iterable) {
        let min = Infinity;
        let max = -Infinity;
        for (const value of iterable) {
          if (typeof value !== "number") {
            console.error(value);
            throw new RangeError("received non-number");
          }
          if (Number.isNaN(value)) {
            throw new RangeError("received NaN");
          }
          min = Math.min(min, value);
          max = Math.max(max, value);
        }
        return { min, max };
      }

      const cityLimits = await fetch("./city-limits.json")
        .then((r) => r.json())
        .then((data) =>
          data.elements
            .values()
            .filter((element) => element.geometry?.length)
            .map((element) => element.geometry.map(latLongToPixel))
            .toArray()
        );

      const width = window.innerWidth;
      const height = window.innerHeight;
      const limits = {
        x: extremes(cityLimits.flatMap((path) => path).map(({ x }) => x)),
        y: extremes(cityLimits.flatMap((path) => path).map(({ y }) => y)),
      };
      const scale = Math.min(
        width / (limits.x.max - limits.x.min),
        height / (limits.y.max - limits.y.min)
      );
      const offset = {
        x: ((limits.x.min + limits.x.max) / 2) * scale - width / 2,
        y: ((limits.y.min + limits.y.max) / 2) * scale - height / 2,
      };

      const pathsToPath = (paths) =>
        paths
          .map((geometry) =>
            geometry
              .map(
                (coord, i) =>
                  `${i === 0 ? "M" : "L"}${coord.x * scale - offset.x} ${
                    coord.y * scale - offset.y
                  }`
              )
              .join("")
          )
          .join("");

      document
        .getElementById("city-limits")
        .setAttributeNS(null, "d", pathsToPath(cityLimits));

      document.getElementById("train-lines").setAttributeNS(
        null,
        "d",
        pathsToPath(
          await fetch("./train-lines.json")
            .then((r) => r.json())
            .then((data) =>
              data.elements
                .values()
                .filter(
                  (element) => element.type === "relation" && element.members
                )
                .flatMap((element) => element.members)
                .filter((member) => member.type === "way" && member.geometry)
                .map((member) => member.geometry.map(latLongToPixel))
                .toArray()
            )
        )
      );

      const stationsFragment = document.createDocumentFragment();
      for (const element of await fetch("./train-stations.json")
        .then((r) => r.json())
        .then((data) => data.elements)) {
        const circ = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );
        const { x, y } = latLongToPixel(element);
        circ.setAttributeNS(null, "cx", x * scale - offset.x);
        circ.setAttributeNS(null, "cy", y * scale - offset.y);
        stationsFragment.append(circ);
      }
      document.getElementById("stations").append(stationsFragment);

      const poiFragment = document.createDocumentFragment();
      for (const element of await fetch("./poi.json")
        .then((r) => r.json())
        .then((data) => data.elements)) {
        const circ = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );
        circ.dataset.tourism = element.tags?.tourism;
        circ.dataset.amenity = element.tags?.amenity;
        const { x, y } = latLongToPixel(element.center ?? element);
        circ.setAttributeNS(null, "cx", x * scale - offset.x);
        circ.setAttributeNS(null, "cy", y * scale - offset.y);
        poiFragment.append(circ);
      }
      document.getElementById("poi").append(poiFragment);

      const streets = await fetch("./streets.json")
        .then((r) => r.json())
        .then((data) => data.elements);
      const streetNodeMap = new Map(
        streets
          .values()
          .filter((element) => element.type === "node")
          .map((element) => [element.id, element])
      );
      const streetPaths = streets
        .values()
        .filter(
          (element) =>
            element.type === "way" &&
            element.nodes?.length &&
            element.tags?.highway
        )
        .map((element) =>
          element.nodes.map((nodeId) =>
            latLongToPixel(streetNodeMap.get(nodeId))
          )
        )
        .toArray();
      document
        .getElementById("streets")
        .setAttributeNS(null, "d", pathsToPath(streetPaths));
    </script>
  </body>
</html>
